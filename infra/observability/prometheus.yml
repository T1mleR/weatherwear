global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: weatherwear-otel
    static_configs:
      - targets: ["otel-collector:8889"]

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
