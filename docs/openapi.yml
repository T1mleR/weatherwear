openapi: 3.0.3
info:
  title: WeatherWear API
  description: |
    WeatherWear runs on Next.js. Real weather is requested from Open-Meteo
    and successful clothing recommendations are stored in PostgreSQL via Prisma.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local Docker Compose deployment

tags:
  - name: Health
    description: Application and database readiness
  - name: Recommendations
    description: Weather-based outfit recommendation and persisted history

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Check application and database readiness
      operationId: getHealth
      responses:
        "200":
          description: Application and PostgreSQL are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example: {status: ok}
        "503":
          description: Database connection unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
              example: {status: unavailable}

  /api/recommendations:
    get:
      tags: [Recommendations]
      summary: List saved recommendations, latest first
      operationId: listRecommendations
      responses:
        "200":
          description: List of persisted recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"
        "500":
          description: Database query failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Recommendations]
      summary: Search city weather and save a clothing recommendation
      description: |
        Uses Open-Meteo geocoding and weather APIs, generates outfit advice
        from weather conditions and stores the result in PostgreSQL.
      operationId: createRecommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecommendationRequest"
            example: {city: "Алматы"}
      responses:
        "201":
          description: Recommendation generated and saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recommendation"
        "400":
          description: Invalid JSON or empty city
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingCity:
                  value: {error: "City is required"}
                invalidJson:
                  value: {error: "Invalid JSON"}
        "500":
          description: Weather lookup failed, unknown city or database failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
    CreateRecommendationRequest:
      type: object
      required: [city]
      properties:
        city:
          type: string
          minLength: 1
          example: "Алматы"
    Weather:
      type: object
      required: [temperature, feelsLike, condition, windSpeed, uvIndex, humidity]
      properties:
        temperature:
          type: number
          description: Temperature in Celsius
        feelsLike:
          type: number
          description: Feels-like temperature in Celsius
        condition:
          type: string
          description: Weather condition as Russian text
        windSpeed:
          type: number
          description: Wind speed in meters per second
        uvIndex:
          type: number
        humidity:
          type: number
          description: Relative humidity percent
    Recommendation:
      type: object
      required: [id, city, createdAt, weather, recommendationText]
      properties:
        id:
          type: string
          format: uuid
        city:
          type: string
        createdAt:
          type: string
          format: date-time
        weather:
          $ref: "#/components/schemas/Weather"
        recommendationText:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
