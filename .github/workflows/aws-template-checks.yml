name: AWS CloudFormation static validation

on:
  pull_request:
  push:
    branches:
      - main
      - feat/postgresql-docker-compose
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-cloudformation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CloudFormation linter
        run: python -m pip install "cfn-lint>=1,<2"

      - name: Lint AWS infrastructure template
        run: cfn-lint infra/aws/cloudformation.yaml

      - name: Check EC2 bootstrap script syntax
        run: bash -n infra/aws/bootstrap.sh

      - name: Validate AWS Docker Compose overlay
        env:
          POSTGRES_PASSWORD: ci-validation-only
        run: docker compose -f docker-compose.yml -f infra/aws/docker-compose.aws.yml config -q
