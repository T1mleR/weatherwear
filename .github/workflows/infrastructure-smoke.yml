name: Infrastructure smoke checks

on:
  pull_request:
  push:
    branches:
      - main
      - feat/postgresql-docker-compose

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: weatherwear
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: weatherwear
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weatherwear -d weatherwear"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://weatherwear:ci-only-password@127.0.0.1:5432/weatherwear?schema=public
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema and apply migrations
        run: |
          npx prisma validate
          npx prisma migrate deploy

      - name: Frontend display unit tests
        run: npm run test:frontend

      - name: Backend recommendation unit tests
        run: npm run test:unit

      - name: Lint and type-check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Start app for PostgreSQL integration checks
        run: |
          npm run start > /tmp/weatherwear-server.log 2>&1 &
          echo $! > /tmp/weatherwear-server.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/weatherwear-server.log
          exit 1

      - name: API + database integration tests
        run: npm run test:integration

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Frontend feature E2E tests (Playwright)
        run: npm run test:e2e

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - name: Validate container image build
        run: docker build --target runner -t weatherwear:ci .

      - name: Server logs on failure
        if: failure()
        run: cat /tmp/weatherwear-server.log || true

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_USER: weatherwear
      POSTGRES_DB: weatherwear
      POSTGRES_PASSWORD: ci-only-password
      APP_PORT: "3000"
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the entire Compose stack
        run: docker compose up --build -d
      - name: Check app readiness, API and database
        run: |
          docker compose ps
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:3000/api/recommendations
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"city":""}' http://127.0.0.1:3000/api/recommendations)" = "400"
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color || true
      - name: Stop Compose services without deleting data volume
        if: always()
        run: docker compose down
